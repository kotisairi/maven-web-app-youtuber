name: create sample workflow in github action 
on:
  push:
    branches:
      - master
      - patch-2
  pull_request:
    branches:
      - master
      - patch-2
jobs:
  checkout:
    name: checkout from the repo
    runs-on: ubuntu-latest
    steps:
      - name: checkout code from repo branch master
        uses: actions/checkout@v6
